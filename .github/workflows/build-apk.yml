name: Gerar APK (Kotlin)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Domínio primeiro: 22 testes (17 portados do PWA + trava + 4 de interoperabilidade com o cripto do PWA).
      - name: Testar domínio
        run: gradle :dominio:test

      - name: Compilar APK de debug
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: financas-casa-kotlin-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes-dominio
          path: dominio/build/reports/tests/test/
